<div class="auth-layout">
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <p class="auth-form-label">FORGOT PASSWORD</p>
      <h2 class="auth-form-title">Reset your password</h2>

       <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
         <div class="form-group">
           <label class="form-label">Email address</label>
           <input type="email" formControlName="email" class="field" placeholder="you@example.com">
           <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" class="error">
             Valid email required
           </div>
         </div>

         <button type="submit" [disabled]="forgotForm.invalid" class="btn-primary">
           Send verification code
         </button>
       </form>

       <p *ngIf="message" class="success-message">
         {{ message }}
         <br>
         <a routerLink="/reset-password" style="display:inline-block; margin-top:0.5rem; text-decoration:underline;">Go to reset password page</a>
       </p>
    </div>
  </div>
</div>
