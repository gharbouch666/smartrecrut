<div style="max-width: 1200px; margin: 0 auto;">
  <div class="page-header">
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Configure your account and preferences</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;">
    <div class="card">
      <h2 class="page-title" style="font-size: 1.25rem; margin-bottom: 0.5rem;">Profile Settings</h2>
      <p class="page-subtitle" style="margin-bottom: 1.5rem;">Update your personal information</p>
      
      <form style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label class="form-label">Full Name</label>
          <input type="text" class="field" placeholder="Your full name">
        </div>
        <div>
          <label class="form-label">Email</label>
          <input type="email" class="field" placeholder="your@email.com">
        </div>
        <button type="button" class="btn-primary">Save Changes</button>
      </form>
    </div>

    <div class="card">
      <h2 class="page-title" style="font-size: 1.25rem; margin-bottom: 0.5rem;">Change Password</h2>
      <p class="page-subtitle" style="margin-bottom: 1.5rem;">Update your password</p>
      
      <form style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label class="form-label">Current Password</label>
          <input type="password" class="field" placeholder="Current password">
        </div>
        <div>
          <label class="form-label">New Password</label>
          <input type="password" class="field" placeholder="New password">
        </div>
        <div>
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="field" placeholder="Confirm new password">
        </div>
        <button type="button" class="btn-primary">Update Password</button>
      </form>
    </div>
  </div>
</div>
