<div class="page-header mb-8 tags-page-header">
  <div class="tags-header-left">
    <div>
      <h1 class="page-title">Skills Library</h1>
      <p class="page-subtitle">Manage technical tags and competencies</p>
    </div>
    <button class="btn-primary" (click)="showAddForm = true">+ New Skill</button>
  </div>
</div>

<div *ngIf="showAddForm" class="card mb-6 tags-card">
  <h2 class="tags-panel__title">{{ editingTag ? 'Edit Skill' : 'Add New Skill' }}</h2>
  <form [formGroup]="tagForm" (ngSubmit)="saveTag()" class="tags-form">
    <div class="tags-form-group">
      <label class="tags-field-label">Skill Name</label>
      <input class="tags-field" formControlName="libelle" placeholder="e.g. React, Python, AWS">
    </div>
    <div class="tags-form-group">
      <label class="tags-field-label">Category</label>
      <select class="tags-field" formControlName="categorie">
        <option value="TECH">TECH - Technical</option>
        <option value="SOFT">SOFT - Soft Skills</option>
        <option value="LANG">LANG - Languages</option>
        <option value="TOOL">TOOL - Tools</option>
        <option value="FRAME">FRAME - Frameworks</option>
      </select>
    </div>
    <div class="tags-form-group tags-form-group--full">
      <button type="submit" [disabled]="tagForm.invalid" class="btn-primary">{{ editingTag ? 'Update' : 'Add' }}</button>
      <button type="button" (click)="cancelAdd()" class="btn-ghost">Cancel</button>
    </div>
  </form>
</div>

<div *ngIf="loading" class="tags-loading">
  <div class="tags-spinner"></div>
</div>

<div *ngIf="!loading && tags.length === 0" class="tags-empty">
  <svg class="tags-empty__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
  </svg>
  <h3 class="tags-empty__title">No Skills Yet</h3>
  <p>Add your first technical skill to get started</p>
  <button class="btn-primary" (click)="showAddForm = true">Add First Skill</button>
</div>

<div *ngIf="!loading && tags.length > 0" class="tags-grid">
  <div *ngFor="let tag of tags" class="tags-card--hover tags-card">
    <div class="tags-card__top">
      <h3 class="tags-name">{{ tag.libelle }}</h3>
      <span class="tags-badge">{{ tag.categorie }}</span>
    </div>
    <div class="tags-actions">
      <button (click)="editTag(tag)" class="tags-btn tags-btn--accent">Edit</button>
      <button (click)="deleteTag(tag.id)" class="tags-btn tags-btn--danger">Delete</button>
    </div>
  </div>
</div>
