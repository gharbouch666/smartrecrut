<header class="settings-header animate-in">
  <div class="settings-header__left">
    <p class="settings-header__role">
      <span class="role-dot"></span>
      Account Settings
    </p>
    <h1 class="settings-header__title">Settings</h1>
  </div>
</header>

<div class="settings-panels">
  <div class="settings-panel animate-in delay-1">
    <h2 class="settings-panel__title">Profile Settings</h2>
    <p class="panel-subtitle">Update your personal information</p>

    <form class="settings-form" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="settings-form-group">
        <label class="settings-form-label">Full Name</label>
        <input type="text" class="settings-form-input" placeholder="Your full name" formControlName="nom">
      </div>
      <div class="settings-form-group">
        <label class="settings-form-label">Email Address</label>
        <input type="email" class="settings-form-input" placeholder="your@email.com" formControlName="email">
      </div>
      <div class="settings-form-group">
        <button type="submit" class="settings-form-button">Save Changes</button>
      </div>
    </form>
  </div>

  <div class="settings-panel animate-in delay-2">
    <h2 class="settings-panel__title">Change Password</h2>
    <p class="panel-subtitle">Update your account password</p>

    <form class="settings-form" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="settings-form-group">
        <label class="settings-form-label">Current Password</label>
        <input type="password" class="settings-form-input" placeholder="Current password" formControlName="oldPassword">
      </div>
      <div class="settings-form-group">
        <label class="settings-form-label">New Password</label>
        <input type="password" class="settings-form-input" placeholder="New password" formControlName="newPassword">
      </div>
      <div class="settings-form-group">
        <label class="settings-form-label">Confirm New Password</label>
        <input type="password" class="settings-form-input" placeholder="Confirm password" formControlName="confirmPassword">
      </div>
      <div class="settings-form-group">
        <button type="submit" class="settings-form-button">Update Password</button>
      </div>

      <p *ngIf="message" [class]="'settings-message ' + (message.includes('success') ? 'settings-message--success' : 'settings-message--error')" class="settings-message">
        {{message}}
      </p>
    </form>
  </div>
</div>
