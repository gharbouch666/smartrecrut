<div class="auth-layout">
  <a routerLink="/" class="back-home-btn">← Back to home</a>

  <div class="auth-brand">
    <div class="auth-brand-inner">
      <div class="auth-logo-pill">SR</div>
      <h1 class="auth-headline">Password recovery.</h1>
      <p class="auth-subline">Enter your email so we can send a secure code and help you get back into your account.</p>
      <svg class="auth-deco" viewBox="0 0 400 300" fill="none">
        <line x1="0" y1="100" x2="400" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="0" y1="200" x2="400" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="133" y1="0" x2="133" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="266" y1="0" x2="266" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="133" cy="100" r="3" fill="rgba(92,109,255,0.7)"/>
        <circle cx="266" cy="200" r="3" fill="rgba(92,109,255,0.7)"/>
      </svg>
    </div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <p class="auth-form-label">FORGOT PASSWORD</p>
      <h2 class="auth-form-title">Reset your password</h2>

       <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
         <div class="form-group">
           <label class="form-label">Email address</label>
           <input type="email" formControlName="email" class="field" placeholder="you@example.com">
           <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" class="error">
             Valid email required
           </div>
         </div>

         <button type="submit" [disabled]="forgotForm.invalid" class="btn-primary">
           Send verification code
         </button>
       </form>

       <p *ngIf="message" class="success-message">
         {{ message }}
         <br>
         <a routerLink="/reset-password" class="auth-link">Go to reset password page</a>
       </p>
    </div>
  </div>
</div>
