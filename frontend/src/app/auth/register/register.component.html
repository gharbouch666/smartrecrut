<div class="auth-layout">
  <!-- Left: Brand Panel -->
  <div class="auth-brand">
    <div class="auth-brand-inner">
      <div class="auth-logo-pill">SR</div>
      <h1 class="auth-headline">Join the<br>future.</h1>
      <p class="auth-subline">AI-powered recruitment for teams that move fast and hire right.</p>
      <svg class="auth-deco" viewBox="0 0 400 300" fill="none">
        <line x1="0" y1="100" x2="400" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="0" y1="200" x2="400" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="133" y1="0" x2="133" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="266" y1="0" x2="266" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="133" cy="100" r="3" fill="rgba(59,130,246,0.6)"/>
        <circle cx="266" cy="200" r="3" fill="rgba(59,130,246,0.6)"/>
      </svg>
    </div>
  </div>

  <!-- Right: Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <p class="auth-form-label">SIGN UP</p>
      <h2 class="auth-form-title">Create Account</h2>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Full name</label>
          <input type="text" formControlName="nom" 
            class="field"
            placeholder="John Doe">
          <div *ngIf="registerForm.get('nom')?.invalid && registerForm.get('nom')?.touched" class="mono" style="color: var(--rose); font-size: 0.75rem; margin-top: 0.5rem;">Name required</div>
        </div>

        <div class="form-group">
          <label class="form-label">Email address</label>
          <input type="email" formControlName="email" 
            class="field"
            placeholder="you@example.com">
          <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="mono" style="color: var(--rose); font-size: 0.75rem; margin-top: 0.5rem;">Valid email required</div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input [type]="hidePassword ? 'password' : 'text'" formControlName="motDePasse" 
            class="field"
            placeholder="Minimum 6 characters">
          <div *ngIf="registerForm.get('motDePasse')?.invalid && registerForm.get('motDePasse')?.touched" class="mono" style="color: var(--rose); font-size: 0.75rem; margin-top: 0.5rem;">Password required (min 6 chars)</div>
        </div>

        <div class="form-group">
          <label class="form-label">Role</label>
          <select formControlName="role" class="form-select">
            <option value="">Select role</option>
            <option value="CANDIDAT">Candidate</option>
            <option value="RECRUTEUR">Recruiter</option>
          </select>
          <div *ngIf="registerForm.get('role')?.invalid && registerForm.get('role')?.touched" class="mono" style="color: var(--rose); font-size: 0.75rem; margin-top: 0.5rem;">Role required</div>
        </div>

        <button type="submit" [disabled]="registerForm.invalid" 
          class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
          Create Account
        </button>
      </form>

      <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-top: 1.5rem;">
        Already have an account? <a routerLink="/login" style="color: var(--accent); font-weight: 600;">Sign in</a>
      </p>
    </div>
  </div>
</div>
