<div class="auth-layout">
  <!-- Back to Home Button -->
  <a routerLink="/" class="back-home-btn">← Back to Home</a>

  <!-- Left: Brand Panel -->
  <div class="auth-brand">
    <div class="auth-brand-inner">
      <div class="auth-logo-pill">SR</div>
      <h1 class="auth-headline">Hire with<br>precision.</h1>
      <p class="auth-subline">AI-powered recruitment for teams that move fast and hire right.</p>
      <svg class="auth-deco" viewBox="0 0 400 300" fill="none">
        <line x1="0" y1="100" x2="400" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="0" y1="200" x2="400" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="133" y1="0" x2="133" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="266" y1="0" x2="266" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="133" cy="100" r="3" fill="rgba(59,130,246,0.6)"/>
        <circle cx="266" cy="200" r="3" fill="rgba(59,130,246,0.6)"/>
      </svg>
    </div>
  </div>

  <!-- Right: Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <p class="auth-form-label">SIGN IN</p>
      <h2 class="auth-form-title">Welcome back</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label">Email address</label>
          <input type="email" formControlName="email" 
            class="field"
            placeholder="you@example.com">
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mono" style="color: var(--rose); font-size: 0.75rem; margin-top: 0.5rem;">Valid email required</div>
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label">Password</label>
          <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" 
            class="field"
            placeholder="Enter your password">
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mono" style="color: var(--rose); font-size: 0.75rem; margin-top: 0.5rem;">Password required</div>
        </div>

        <div style="text-align: right; margin-bottom: 1.5rem;">
          <a class="mono" style="font-size: 0.75rem; color: var(--accent); cursor: pointer;">Forgot password?</a>
        </div>

        <button type="submit" [disabled]="loginForm.invalid" 
          class="btn-primary" style="width: 100%; justify-content: center;">
          Sign in
        </button>
      </form>

      <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-top: 1.5rem;">
        Don't have an account? <a routerLink="/register" style="color: var(--accent); font-weight: 600;">Create one</a>
      </p>
    </div>
  </div>
</div>
