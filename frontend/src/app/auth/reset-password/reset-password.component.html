<div class="auth-layout">
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <p class="auth-form-label">RESET PASSWORD</p>
      <h2 class="auth-form-title">Create new password</h2>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" formControlName="email" class="field" placeholder="Enter your email">
          <div *ngIf="resetForm.get('email')?.invalid && resetForm.get('email')?.touched" class="error">
            Valid email required
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Verification Code</label>
          <input type="text" formControlName="code" class="field" placeholder="Enter 6-digit code" maxlength="6">
          <div *ngIf="resetForm.get('code')?.invalid && resetForm.get('code')?.touched" class="error">
            6-digit verification code required
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">New password</label>
          <input type="password" formControlName="newPassword" class="field" placeholder="Enter new password">
          <div *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched" class="error">
            Password must be at least 6 characters
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm password</label>
          <input type="password" formControlName="confirmPassword" class="field" placeholder="Confirm password">
          <div *ngIf="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched" class="error">
            Password confirmation required
          </div>
          <div *ngIf="resetForm.errors?.['passwordMismatch'] && (resetForm.get('confirmPassword')?.dirty || resetForm.get('newPassword')?.dirty)" class="error">
            Passwords do not match
          </div>
        </div>

        <button type="submit" [disabled]="resetForm.invalid" class="btn-primary">
          Reset password
        </button>
      </form>

      <p *ngIf="message" class="success-message">{{ message }}</p>
    </div>
  </div>
</div>
